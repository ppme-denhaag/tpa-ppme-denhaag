name: Tests
on: [pull_request]

env:
  # Dummy values so the client guard clause doesn't throw during build/e2e —
  # no real Supabase calls are exercised by the current test suite.
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # RLS automated suite (test-plan.md §3, RLS-01..21) — merge gate for any
  # migration change per the test plan. Runs against a fresh local Postgres
  # (Docker, via the Supabase CLI's own stack) built from supabase/migrations,
  # never against the live/linked project — no secrets required.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db --local supabase/tests/database
